services:
  noted:
    image: logus2k/noted
    container_name: noted
    build: .
    pull_policy: never
    ports:
      - "8123:8123"
    volumes:
      - ./data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
